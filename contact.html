</head>

<body>

    <nav class="navbar md:navbar-expand bg-1">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Nine Lives Rescue</a>
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body mb-2 md:mb-0">
        <ul class="nav navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Gallery</a>
          </li>
          <li class="nav-item">

          </li>
          <li class="nav-item">
            <a class="nav-link active" href="contact.html">Contact Us</a>
          </li>
        </ul>
        <form class="hstack gap-2" role="search">
          <input class="form-control" type="search" placeholder="Search" aria-label="Search"/>
          <button class="btn-solid btn-icon theme-secondary" type="submit">
            <svg class="bi" width="16" height="16"><use href="#search" /></svg>
          </button>
        </form>
      </div>
    </dialog>
  </div>

<main>
<h1 class="text-center m-8">Have a Question? Contact Us</h1>

<div class="container mt-3">
<form style="max-width: 900px" class="mx-auto">
    <div class="row g-4">
        <div class="md:col-6">
        <div class="form-field">
        <label for="firstName" class="form-label">First name</label>
        <input type="text" class="form-control" id="firstName">
    </div>
    </div>
        <div class="md:col-6">
        <div class="form-field">
        <label for="lastName" class="form-label">Last name</label>
        <input type="text" class="form-control" id="lastName">
    </div>
    </div>
    <div class="md:col-6">
        <div class="form-field">
        <label for="emailAddress" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="emailAddress" placeholder="name@example.com">
    </div>
    </div>
    <div class="md:col-6">
        <div class="form-field">
            <label for="inquiryForm" class="form-label">Inquiry Type</label>
            <select class="form-control" id="inquiryForm">
                <option>Choose one</option>
                <option value="1">Adoption</option>
                <option value="2">Volunteering</option>
                <option value="3">Donation</option>
            </select>
    </div>
    </div>
    <div class="md:col-6">
    <div class="form-field">
        <label for="textArea" class="form-label">Comments</label>
        <textarea class="form-control" id="textArea"></textarea>
    </div>
    </div>   
    <div class="md:col-6 mt-auto">
    <div class="form-field">
        <div class="form-field">
        <input type="checkbox" id="checkLabel" class="check" />
        <label for="checkLabel">I would like to receive email updates</label>
    </div>
    </div>
</div>
    <button class="btn-solid theme-primary mt-5">Submit</button>
</form>
</div>
</main>

<footer class="bg-primary text-center p-3 mt-5">
  <p>Copyright 2026 Nine Lives Rescue. All rights reserved.</p>
</footer>

</body>
